name: Deploy Documentation

# Publishes the MkDocs site to GitHub Pages via an artifact -- no built HTML is ever
# committed. docs/, mkdocs.yml and site/ are all gitignored and regenerated here from
# the committed schemas/ directory, which is the input because the runner has no
# lakehouse access. Refresh it locally with `just linkml-all && just promote`.
#
# Requires: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'schemas/**/*.yaml'
      - 'src/**'
      - 'justfile'
      - 'pyproject.toml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read      # nothing is pushed back to the repository
  pages: write
  id-token: write     # lets Pages verify the deployment came from this workflow

# Let an in-flight deployment finish rather than cancelling it; only queue-jump builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: uv sync --group docs

      # Generates docs/<catalog>/<schema>/ for every schema, then rebuilds
      # docs/index.md and the mkdocs nav from what is actually on disk.
      - name: Generate reference pages and navigation
        run: just gendoc

      - name: Build site
        run: just site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The whole site directory becomes the deployment; nothing lands in git.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

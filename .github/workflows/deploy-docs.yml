name: Deploy Documentation

# Docs are never committed. Everything under docs/ and mkdocs.yml is regenerated here
# from the committed schemas/ directory and published to the gh-pages branch. The
# runner has no lakehouse access, so schemas/ is the input -- refresh it locally with
# `just linkml-all && just promote` and commit that.

on:
  push:
    branches: [main]
    paths:
      - 'schemas/**/*.yaml'
      - 'src/**'
      - 'justfile'
      - 'pyproject.toml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Only the most recent commit on main needs publishing; cancel superseded runs.
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # mkdocs gh-deploy pushes to the gh-pages branch

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gh-deploy needs history to update gh-pages

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: uv sync --group docs

      - name: Generate reference pages and navigation
        run: just gendoc

      - name: Build site
        run: |
          touch docs/.nojekyll
          just site

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          just deploy

          \ the normalization should strive to enforce the\n    following semantics: * normscores are\
          \ floating point numbers >= 0,\n    * high normscores are better than low one. For most programs,\
          \ it would be sufficient to make the normscore the same as this rawscore, providing these semantics\
          \ are satisfied."
      significance:
        range: double
        description: "This is some kind of expectation or probability metric, representing the probability\
          \ that the analysis would appear randomly given the model. As such, any program or person querying\
          \ this table can assume the following semantics:\n   * 0 <= significance <= n, where n is a\
          \ positive number, theoretically unbounded but unlikely to be more than 10\n  * low numbers\
          \ are better than high numbers."
      identity:
        range: double
        description: Percent identity between the locations compared.  Note that these 4 metrics do not
          cover the full range of scores possible; it would be undesirable to list every score possible,
          as this should be kept extensible. instead, for non-standard scores, use the analysisprop table.
    description: "Computational analyses generate features (e.g. Genscan generates transcripts and exons;\
      \ sim4 alignments generate similarity/match features). analysisfeatures are stored using the feature\
      \ table from the sequence module. The analysisfeature table is used to decorate these features,\
      \ with analysis specific attributes. A feature is an analysisfeature if and only if there is a corresponding\
      \ entry in the analysisfeature table. analysisfeatures will have two or more featureloc entries,\n\
      \ with rank indicating query/subject"
    aliases:
    - analysisfeature

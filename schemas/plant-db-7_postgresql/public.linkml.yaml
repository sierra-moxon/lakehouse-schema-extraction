id: https://w3id.org/jgi/public
name: public
title: plant-db-7_postgresql.public
description: Generated from plant-db-7_postgresql.public by schema-automator, with types and nullability
  refined from native catalog metadata by lakehouse-schema-extraction.
prefixes:
  linkml: https://w3id.org/linkml/
  public: https://w3id.org/jgi/public/
default_prefix: public
default_range: string

classes:
  Analysis:
    attributes:
      analysis_id:
        identifier: true
        range: integer
      name:
        range: string
        description: "A way of grouping analyses. This\n    should be a handy short identifier that can\
          \ help people find an\n    analysis they want. For instance \"tRNAscan\", \"cDNA\", \"FlyPep\"\
          ,\n    \"SwissProt\", and it should not be assumed to be unique. For instance, there may be\
          \ lots of separate analyses done against a cDNA database."
      description:
        range: string
      program:
        range: string
        required: true
        description: Program name, e.g. blastx, blastp, sim4, genscan.
      programversion:
        range: string
        required: true
        description: Version description, e.g. TBLASTX 2.0MP-WashU [09-Nov-2000].
      algorithm:
        range: string
        description: Algorithm name, e.g. blast.
      sourcename:
        range: string
        description: Source name, e.g. cDNA, SwissProt.
      sourceversion:
        range: string
      sourceuri:
        range: string
        description: This is an optional, permanent URL or URI for the source of the  analysis. The idea
          is that someone could recreate the analysis directly by going to this URI and fetching the source
          data (e.g. the blast database, or the training model).
      timeexecuted:
        range: datetime
        required: true
      is_obsolete:
        range: boolean
        required: true
    description: "An analysis is a particular type of a\n    computational analysis; it may be a blast\
      \ of one sequence against\n    another, or an all by all blast, or a different kind of analysis\n\
      \    altogether. It is a single unit of computation."
    aliases:
    - analysis

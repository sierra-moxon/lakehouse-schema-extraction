      distinct class or concept. A concept can be refered to by different

      phrases or names. In addition to the primary name (cvterm.name) there

      can be a number of alternative aliases or synonyms. For example, "T

      cell" as a synonym for "T lymphocyte".'
    aliases:
    - cvtermsynonym
  DbxrefRelationship:
    attributes:
      dbxref_relationship_id:
        identifier: true
        range: integer
      subject_id:
        range: Dbxref
      object_id:
        range: Dbxref
      type_id:
        range: Cvterm
      value:
        range: string
        description: Additional notes or comments.
      rank:
        range: integer
        required: true
        description: The ordering of subject dbxref with respect to the object dbxref may be important
          (for example, exon ordering on a transcript - not always derivable if you take trans spliced
          genes into consideration). Rank is used to order these; starts from zero.
    description: 'Dbxref can be arranged in

      graphs, e.g. "goterm is_a anoter_goter"; If type is

      thought of as a verb, the each arc or edge makes a statement

      [Subject Verb Object]. The object can also be thought of as parent

      (containing dbxref), and subject as child (contained dbxref or

      subdbxref). We include the relationship rank/order, because even

      though most of the time we can order things implicitly by sequence

      coordinates, we can not always do this - e.g. transpliced genes. It is also

      useful for quickly getting implicit introns.'
    aliases:
    - dbxref_relationship
  Dbxrefprop:
